services:
  # CCX API 代理服务 (一体化架构: 后端 + 前端界面)
  ccx:
    # image: crpi-i19l8zl0ugidq97v.cn-hangzhou.personal.cr.aliyuncs.com/bene/ccx:latest
    # 本地构建使用以下配置（注释掉 image 行）:
    build:
      context: .
      dockerfile: Dockerfile
      # 中国网络使用:
      # dockerfile: Dockerfile_China
      target: runtime
    container_name: ccx
    ports:
      # 统一端口：前端界面 + API + 管理接口
      - '3002:3000'
    volumes:
      # 配置目录持久化
      - ./.config:/app/.config
      # 可选：日志持久化
      - ./logs:/app/logs
    environment:
      # 基础配置
      - ENV=development
      # 是否启用Web管理界面 (true=一体化模式, false=纯API模式)
      - ENABLE_WEB_UI=true
      # 代理访问密钥 - 用于验证客户端对代理服务器的访问权限
      - PROXY_ACCESS_KEY=${PROXY_ACCESS_KEY:-your-proxy-access-key}
      # 管理 API 独立密钥（可选，未设置时回退到 PROXY_ACCESS_KEY）
      # 设置后，Web 管理界面和 /api/* 端点将使用此密钥认证，与代理密钥隔离
      - PORT=3000
      # 日志级别 (error, warn, info, debug)
      - LOG_LEVEL=warn
      # 上游首个响应头等待时间；长推理模型非流式请求可能超过默认 60 秒
      - RESPONSE_HEADER_TIMEOUT=120
      # 是否启用请求日志
      - ENABLE_REQUEST_LOGS=false
      # 是否启用响应日志
      - ENABLE_RESPONSE_LOGS=false
      # 统一 PostgreSQL 连接（metrics + sessions）
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/ccx?sslmode=disable
      # 指标数据保留天数
      - METRICS_RETENTION_DAYS=30
      # 会话内存清理 TTL（秒）
      - SESSION_TTL=86400
    depends_on:
      postgres:
        condition: service_healthy
    # 健康检查配置
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # 资源限制 (Go 应用内存占用更低)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'

    # 重启策略
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ccx-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ccx
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

# 网络配置（可选，使用默认bridge网络）
# networks:
#   default:
#     driver: bridge

volumes:
  pgdata:
